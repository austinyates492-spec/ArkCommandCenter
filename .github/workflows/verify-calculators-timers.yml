name: Verify knockout and shared timers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ark-command-center-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test

  desktop-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ark-command-center-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ark-command-center-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
