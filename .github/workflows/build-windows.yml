name: Build and Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ark-command-center-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ark-command-center-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ark-command-center-desktop/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Test calculators
        run: npm test
      - name: Build Windows installer with tribe cloud enabled
        env:
          VITE_API_URL: https://ark-command-center-api-production.up.railway.app
        run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: ARK-Command-Center-Windows-Installer
          path: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish tribe installer release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          name: ARK Command Center v0.7.0 - Tribe Cloud
          body: |
            Windows installer with six-member invitation-only tribe accounts, personal cloud saves,
            and shared server intelligence. API hosted on Railway.

            This is a private repository. Tribe members need GitHub access to download the installer.
          files: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
