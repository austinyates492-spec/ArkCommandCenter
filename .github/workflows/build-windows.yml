name: Build and Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ark-command-center-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test tribe API and security logic
        run: npm test
  windows:
    needs: api-tests
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ark-command-center-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ark-command-center-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ark-command-center-desktop/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Test calculators and data
        run: npm test
      - name: Build Windows installer with tribe cloud enabled
        env:
          VITE_API_URL: https://ark-command-center-api-production.up.railway.app
        run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: ARK-Command-Center-Windows-Installer
          path: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish tribe installer release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.2
          name: ARK Command Center v0.8.2 - Remembered Tribe Login
          body: |
            Adds optional revocable 30-day remembered sign-in sessions with automatic refresh.
            Passwords are never stored in the desktop app. Includes the fifteen full-screen
            themes and all v0.8 Tribe Live timers, crafting, and server sync functionality.

            This is a private repository. Tribe members need GitHub access to download the installer.
          files: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
