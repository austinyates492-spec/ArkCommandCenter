name: Build and Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ark-command-center-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test tribe API and security logic
        run: npm test
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: api-tests
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ark-command-center-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ark-command-center-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ark-command-center-desktop/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Test calculators and data
        run: npm test
      - name: Build signed Windows installer and publish secure in-app update
        shell: pwsh
        env:
          VITE_API_URL: https://ark-command-center-api-production.up.railway.app
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://ark-command-center-api-production.up.railway.app/api/v1/updates'
          function Get-ReleaseAuth {
            $identity = Invoke-RestMethod -Method Get -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=ark-command-center-updates" -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            return @{ Authorization = "Bearer $($identity.value)" }
          }
          $signing = $null
          for ($attempt = 1; $attempt -le 40; $attempt++) {
            try {
              $signing = Invoke-RestMethod -Method Post -Uri "$base/build-key" -Headers (Get-ReleaseAuth)
              break
            }
            catch {
              if ($attempt -eq 40) { throw 'Could not obtain verified signing credentials after waiting for API deployment.' }
              Start-Sleep -Seconds 15
            }
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = $signing.privateKey
          npm run installer
          if ($LASTEXITCODE -ne 0) { throw 'Tauri installer build failed' }
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $bundle = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (!$bundle) { throw 'Installer not found' }
          $signature = Get-Content -Raw "$($bundle.FullName).sig"
          # GitHub OIDC tokens expire quickly; the Rust installer build may take
          # longer than the original token lifetime. Request a fresh one here.
          $auth = Get-ReleaseAuth
          $auth['x-tauri-signature'] = $signature.Trim()
          Invoke-RestMethod -Uri "$base/publish?version=$version" -Method Post -InFile $bundle.FullName -ContentType 'application/octet-stream' -Headers $auth
      - uses: actions/upload-artifact@v4
        with:
          name: ARK-Command-Center-Windows-Installer
          path: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish tribe installer release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.11
          name: ArkTribeHQ v0.8.11 - Responsive Creature Portraits
          body: |
            Adds the Enigmasaur live taming challenge and map coverage, updates
            Giganotosaurus to its v97 Apex Challenge, and removes stale tranq math.
            Loadout panels display matching species portraits licensed by ARK Utils.
            Live Data is hidden from the sidebar while catalog checks keep running.
            Signed Windows auto-updates continue from the existing install.
          files: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
