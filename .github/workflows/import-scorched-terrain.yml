name: Import Scorched Earth ASA terrain and resource data (review branch)
on:
  push:
    branches:
      - feature/scorched-earth-asa-resource-atlas-20261125
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-scorched:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate and download the exact Scorched Earth ASA wiki terrain and resources
        run: |
          python -m pip install --quiet requests pillow
          python scripts/import-scorched-asa.py
      - name: Commit verified source assets to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/public/maps/scorched-earth-asa.jpg ark-command-center-desktop/src/scorched-asa-wiki-resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import official-wiki Scorched Earth ASA terrain and coordinates"
            git pull --rebase origin feature/scorched-earth-asa-resource-atlas-20261125
            git push
          fi
