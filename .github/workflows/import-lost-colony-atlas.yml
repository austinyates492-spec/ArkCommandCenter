name: Inspect Lost Colony ASA terrain and wiki source data (review)
on:
  push:
    branches: [feature/lost-colony-native-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-lost-colony-atlas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/src/lost-colony-wiki-resources.json ark-command-center-desktop/public/maps/lost-colony-asa.jpg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Import authentic Lost Colony terrain and wiki sources"
            git pull --rebase origin feature/lost-colony-native-atlas-20261125
            git push
          fi
