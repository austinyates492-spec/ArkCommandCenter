name: Import Ragnarok ASA terrain and wiki resource locations (review)
on:
  push:
    branches: [feature/ragnarok-asa-resource-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-ragnarok-atlas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/src/ragnarok-wiki-resources.json ark-command-center-desktop/public/maps/ragnarok-asa.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import Ragnarok official wiki resources and ASA terrain"
            git pull --rebase origin feature/ragnarok-asa-resource-atlas-20261125
            git push
          fi
