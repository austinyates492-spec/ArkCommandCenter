name: Import Center ASA terrain and source coordinates (review branch)
on:
  push:
    branches: [feature/center-asa-resource-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate genuine Center ASA assets
        run: |
          python -m pip install --quiet requests pillow
          python scripts/import-center-asa.py
      - name: Commit inspected asset bytes and wiki resource locations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/public/maps/the-center-asa.jpg ark-command-center-desktop/src/center-asa-wiki-resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified Center ASA wiki terrain and mapped resources"
            git pull --rebase origin feature/center-asa-resource-atlas-20261125
            git push
          fi
