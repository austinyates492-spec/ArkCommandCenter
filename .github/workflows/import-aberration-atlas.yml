name: Import Aberration terrain and wiki resource references (review)
on:
  push:
    branches: [feature/aberration-zone-focus-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact ASA terrain and source-labelled reference points
        run: |
          python -m pip install --quiet requests pillow
          python scripts/import-aberration-atlas.py
      - name: Commit audited source assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/public/maps/aberration-asa.jpg ark-command-center-desktop/src/aberration-wiki-resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import genuine Aberration ASA terrain and wiki resource references"
            git pull --rebase origin feature/aberration-zone-focus-20261125
            git push
          fi
