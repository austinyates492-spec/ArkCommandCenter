name: Import Extinction ASA terrain and wiki resource records (review)
on:
  push:
    branches: [feature/extinction-asa-resource-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-extinction-atlas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/src/extinction-wiki-resources.json ark-command-center-desktop/public/maps/extinction-asa.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import validated Extinction terrain and wiki data"
            git pull --rebase origin feature/extinction-asa-resource-atlas-20261125
            git push
          fi
