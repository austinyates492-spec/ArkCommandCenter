name: Import Island ASA resource dataset (review)
on:
  push:
    branches: [feature/island-resource-overlay-custom-pin-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify wiki source
        run: |
          python -m pip install --quiet requests
          python scripts/import-island-resource-data.py
      - name: Commit pinned ASA resource dataset to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/src/island-asa-wiki-resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified ASA Island Wiki resource coordinates"
            git pull --rebase origin feature/island-resource-overlay-custom-pin-20261125
            git push
          fi
