name: Import Valguero ASA terrain and wiki resource references (review)
on:
  push:
    branches: [feature/valguero-asa-resource-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-valguero-atlas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/src/valguero-wiki-resources.json ark-command-center-desktop/public/maps/valguero-asa.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import Valguero wiki resources and genuine ASA terrain"
            git pull --rebase origin feature/valguero-asa-resource-atlas-20261125
            git push
          fi
