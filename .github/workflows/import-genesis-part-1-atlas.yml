name: Inspect Genesis Part 1 Wiki ASA resource and biome map sources
on:
  push:
    branches: [feature/genesis-part-1-native-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-genesis-part-1-atlas.py
