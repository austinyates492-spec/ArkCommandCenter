name: Inspect Genesis Part 1 Wiki ASA resource and biome map sources
on:
  push:
    branches: [feature/genesis-part-1-native-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-genesis-part-1-atlas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/public/maps/genesis-part-1-asa.jpg ark-command-center-desktop/src/genesis-part-1-wiki-resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import Genesis Part 1 genuine ASA terrain and wiki GPS source"
            git pull --rebase origin feature/genesis-part-1-native-atlas-20261125
            git push
          fi
