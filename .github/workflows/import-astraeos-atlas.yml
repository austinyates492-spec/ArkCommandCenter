name: Inspect Astraeos authentic map art and source resource points (review)
on:
  push:
    branches: [feature/astraeos-asa-resource-atlas-20261125]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet requests pillow
          python scripts/import-astraeos-atlas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ark-command-center-desktop/src/astraeos-wiki-resources.json ark-command-center-desktop/public/maps/astraeos-asa.jpg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Import source-verified Astraeos map and resource assets"
            git pull --rebase origin feature/astraeos-asa-resource-atlas-20261125
            git push
          fi
