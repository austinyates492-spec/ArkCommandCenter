
name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ark-command-center-desktop

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ark-command-center-desktop/src-tauri

      - name: Install application dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run installer

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ARK-Command-Center-Windows-Installer
          path: ark-command-center-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
